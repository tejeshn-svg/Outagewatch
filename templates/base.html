<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OutageWatch{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">OW</span>
        <span class="brand-text">OutageWatch</span>
      </a>
      <nav class="nav">
        <a href="/" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
        <a href="/history" class="{{ 'on' if page == 'history' }}">Incident history</a>
        <a href="/api/status.json">API</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap foot">
    <span>OutageWatch &mdash; built by
      <a href="https://github.com/tejeshn-svg" target="_blank" rel="noopener">tejeshn-svg</a>
      &middot; data pulled from each vendor's own official status feed</span>
  </footer>
</body>
</html>
